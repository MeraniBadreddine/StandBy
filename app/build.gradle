plugins {
    id 'com.android.application'
}

android {
    namespace 'com.standby.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.standby.phone'
        minSdk 24
        targetSdk 35
        versionCode 40
        versionName '4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // No external dependencies — pure platform APIs only
}
