plugins {
    id 'com.android.application'
}

android {
    namespace 'com.standby.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.standby.tv'
        minSdk 24          // was 21: UI needs a modern WebView (Chromium 88+)
        targetSdk 35
        versionCode 36
        versionName '3.15'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // No external dependencies — pure platform APIs only
}